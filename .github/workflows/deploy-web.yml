name: Deploy web to Vercel

# Builds the Flutter web release and deploys it to Vercel whenever `main`
# is updated. Vercel cannot build Flutter projects natively, so the build
# happens here and the finished build/web output is uploaded via the
# Vercel CLI (prebuilt static deployment).
#
# Required GitHub Actions secrets (repo -> Settings -> Secrets and
# variables -> Actions):
#   VERCEL_TOKEN       - Vercel account token (Account Settings -> Tokens)
#   VERCEL_ORG_ID      - organization id, shown in .vercel/project.json
#                        after running `vercel link`, or in Vercel team
#                        settings
#   VERCEL_PROJECT_ID  - project id, next to VERCEL_ORG_ID in
#                        .vercel/project.json after `vercel link`

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-deploy-web
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    # Web builds only need the Flutter SDK - no JDK or Gradle involved.
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x # matches the version the app was developed on
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run test suite
        run: flutter test

      - name: Build web release
        run: flutter build web --release

      # The COOP/COEP + cache headers must be part of the deployed
      # directory itself: when deploying a subdirectory, vercel.json at
      # the deployment root is the only config file Vercel reads.
      - name: Apply Vercel header config to the build output
        run: cp web/vercel.json build/web/vercel.json

      - name: Deploy production build to Vercel
        run: npx --yes vercel@latest deploy build/web --prod --yes --token="$VERCEL_TOKEN"
